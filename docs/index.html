<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#15140f" media="(prefers-color-scheme: dark)">
  <meta name="robots" content="noindex">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Cupones">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icono-180.png">
  <title>Cazacupones</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✂️</text></svg>">
  <style>
    :root {
      --bg: #f4f1ea; --card: #fffdf8; --ink: #1d1b16; --muted: #6f6a5f;
      --line: #e4ddcf; --accent: #c8431f; --accent-soft: #fde7df; --on-accent: #fff; --ok: #2f7d4f;
      --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #15140f; --card: #1f1d17; --ink: #f1ece0; --muted: #a39d8e;
        --line: #343028; --accent: #ff7a54; --accent-soft: #3a2219; --on-accent: #1e0f08; --ok: #6fcf97;
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    }
    .contenedor { max-width: 640px; margin: 0 auto; }

    header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 8px 0 14px; }
    h1 { margin: 0; font-size: 28px; letter-spacing: -0.02em; line-height: 1.05; }
    h1 span { color: var(--accent); }
    .estado { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
    .recargar {
      border: 1px solid var(--line); background: var(--card); color: var(--ink);
      border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 14px; cursor: pointer; flex: none;
    }
    .recargar:active { transform: scale(.97); }

    .filtros { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 12px; scrollbar-width: none; }
    .filtros::-webkit-scrollbar { display: none; }
    .filtro {
      flex: none; border: 1px solid var(--line); background: transparent; color: var(--ink);
      border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 14px; cursor: pointer;
    }
    .filtro[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
    .filtro small { opacity: .7; margin-left: 4px; }

    .cupon {
      position: relative; background: var(--card); border: 1px solid var(--line);
      border-radius: 14px; margin: 0 0 12px; overflow: hidden;
    }
    .cupon.nuevo { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
    .cuerpo { padding: 14px 16px 12px; }
    .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
    .chip { background: var(--accent-soft); color: var(--accent); font-weight: 600; border-radius: 6px; padding: 2px 8px; }
    .badge { background: var(--accent); color: var(--on-accent); font-weight: 700; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; border-radius: 6px; padding: 2px 6px; }
    .usuario { color: var(--ink); font-weight: 600; }
    .texto { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    .texto a { color: var(--accent); }
    .texto mark { background: var(--accent-soft); color: inherit; border-radius: 3px; padding: 0 2px; font-family: var(--mono); font-size: .95em; }

    .talon { position: relative; border-top: 2px dashed var(--line); padding: 10px 16px 12px; display: grid; gap: 8px; }
    .talon::before, .talon::after {
      content: ""; position: absolute; top: -9px; width: 16px; height: 16px; border-radius: 50%;
      background: var(--bg); border: 1px solid var(--line);
    }
    .talon::before { left: -9px; } .talon::after { right: -9px; }
    .codigo { display: flex; align-items: center; gap: 10px; }
    .codigo code {
      font-family: var(--mono); font-size: 17px; font-weight: 700; letter-spacing: .06em;
      border: 1.5px dashed var(--accent); color: var(--accent); border-radius: 8px; padding: 4px 10px;
    }
    .codigo .etq { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .boton {
      border: 0; border-radius: 10px; padding: 9px 14px; font: inherit; font-size: 14px; font-weight: 600;
      cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center;
    }
    .copiar { background: var(--ink); color: var(--bg); margin-left: auto; }
    .copiar.ok { background: var(--ok); color: #fff; }
    .abrir { background: var(--accent); color: var(--on-accent); width: 100%; }

    .avisos { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin: 0 0 14px; }
    .avisos h2 { margin: 0 0 6px; font-size: 16px; }
    .avisos p, .avisos ol { margin: 6px 0; color: var(--muted); font-size: 14px; }
    .avisos ol { padding-left: 20px; }
    .avisos b { color: var(--ink); }
    .avisos .fila { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .avisos textarea {
      width: 100%; height: 96px; margin-top: 8px; font: 12px/1.35 var(--mono); color: var(--ink);
      background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px; resize: vertical;
    }
    .secundario { background: transparent; color: var(--ink); border: 1px solid var(--line); }
    .alerta { color: var(--accent); font-weight: 600; }
    .ok-texto { color: var(--ok); font-weight: 600; }
    .vacio { text-align: center; color: var(--muted); padding: 48px 12px; border: 2px dashed var(--line); border-radius: 14px; }
    .vacio strong { display: block; color: var(--ink); font-size: 18px; margin-bottom: 6px; }
    footer { color: var(--muted); font-size: 13px; text-align: center; margin-top: 20px; }
  </style>
</head>
<body>
<div class="contenedor">
  <header>
    <div>
      <h1>Caza<span>cupones</span></h1>
      <p class="estado" id="estado">Cargando…</p>
      <p class="estado" id="revision"></p>
    </div>
    <button class="recargar" id="recargar" type="button">Actualizar</button>
  </header>

  <section class="avisos" id="avisos" hidden></section>

  <nav class="filtros" id="filtros" aria-label="Filtrar por búsqueda"></nav>
  <main id="lista"></main>

  <footer>Las búsquedas corren cada ~10 minutos · esta página se actualiza sola</footer>
</div>

<script>
  const MIN_NUEVO = 30;            // minutos en que un post se marca como "nuevo"
  const RECARGA_MS = 2 * 60 * 1000;

  let datos = { actualizado: null, items: [] };
  let filtro = "Todos";

  const $ = (id) => document.getElementById(id);
  const rtf = new Intl.RelativeTimeFormat("es-AR", { numeric: "auto" });

  function haceCuanto(iso) {
    if (!iso) return "";
    const seg = (new Date(iso) - Date.now()) / 1000;
    const abs = Math.abs(seg);
    if (abs < 60) return "recién";
    if (abs < 3600) return rtf.format(Math.round(seg / 60), "minute");
    if (abs < 86400) return rtf.format(Math.round(seg / 3600), "hour");
    return rtf.format(Math.round(seg / 86400), "day");
  }

  function escapar(t) {
    return String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function textoConFormato(texto, codigos) {
    let html = escapar(texto).replace(/https?:\/\/[^\s<]+/g, (u) => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
    for (const c of codigos || []) {
      if (!/^[A-Za-z0-9]+$/.test(c)) continue;
      const re = new RegExp("(^|[^\\w/])(" + c + ")(?![\\w/])", "g");
      html = html.replace(re, "$1<mark>$2</mark>");
    }
    return html;
  }

  function enlaceSeguro(url) {
    return /^https:\/\/(x|twitter)\.com\//.test(url || "") ? url : "#";
  }

  function pintarFiltros() {
    const conteo = {};
    for (const it of datos.items) conteo[it.busqueda] = (conteo[it.busqueda] || 0) + 1;
    const nombres = ["Todos", ...Object.keys(conteo)];
    if (!nombres.includes(filtro)) filtro = "Todos";
    $("filtros").innerHTML = nombres.length > 2 || filtro !== "Todos"
      ? nombres.map((n) => {
          const cant = n === "Todos" ? datos.items.length : conteo[n];
          return `<button class="filtro" type="button" data-f="${escapar(n)}" aria-pressed="${n === filtro}">${escapar(n)}<small>${cant}</small></button>`;
        }).join("")
      : "";
  }

  function pintarLista() {
    const items = datos.items.filter((it) => filtro === "Todos" || it.busqueda === filtro);
    if (!items.length) {
      $("lista").innerHTML = `<div class="vacio"><strong>Todavía no hay hallazgos</strong>
        Cuando alguien publique algo que coincida con tus búsquedas, aparece acá y te llega al celular.</div>`;
      return;
    }
    $("lista").innerHTML = items.map((it) => {
      const nuevo = (Date.now() - new Date(it.fecha)) / 60000 < MIN_NUEVO;
      const codigos = (it.codigos || []).map((c) => `
        <div class="codigo">
          <div><div class="etq">Posible código</div><code>${escapar(c)}</code></div>
          <button class="boton copiar" type="button" data-codigo="${escapar(c)}">Copiar</button>
        </div>`).join("");
      return `
        <article class="cupon${nuevo ? " nuevo" : ""}">
          <div class="cuerpo">
            <div class="meta">
              ${nuevo ? '<span class="badge">Nuevo</span>' : ""}
              <span class="chip">${escapar(it.busqueda)}</span>
              ${it.usuario ? `<span class="usuario">@${escapar(it.usuario)}</span>` : ""}
              <time datetime="${escapar(it.fecha)}" title="${new Date(it.fecha).toLocaleString("es-AR")}">${haceCuanto(it.fecha)}</time>
            </div>
            <p class="texto">${textoConFormato(it.texto, it.codigos)}</p>
          </div>
          <div class="talon">
            ${codigos}
            <a class="boton abrir" href="${escapar(enlaceSeguro(it.url))}" target="_blank" rel="noopener">Abrir en X</a>
          </div>
        </article>`;
    }).join("");
  }

  function pintarEstado() {
    const n = datos.items.length;
    $("estado").textContent = datos.actualizado
      ? `Último hallazgo ${haceCuanto(datos.actualizado)} · ${n} guardado${n === 1 ? "" : "s"}`
      : "Esperando el primer hallazgo";
  }

  function pintar() { pintarEstado(); pintarFiltros(); pintarLista(); }

  async function cargar() {
    try {
      const r = await fetch(`resultados.json?t=${Date.now()}`, { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      datos = await r.json();
      datos.items = datos.items || [];
      pintar();
    } catch (e) {
      $("estado").textContent = "No se pudieron cargar los resultados. Probá de nuevo en un rato.";
    }
  }

  async function copiar(texto, boton, etiqueta = "Copiar") {
    try {
      await navigator.clipboard.writeText(texto);
    } catch {
      const ta = document.createElement("textarea");
      ta.value = texto; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove();
    }
    boton.textContent = "¡Copiado!"; boton.classList.add("ok");
    setTimeout(() => { boton.textContent = etiqueta; boton.classList.remove("ok"); }, 1600);
  }

  document.addEventListener("click", (e) => {
    const f = e.target.closest(".filtro");
    if (f) { filtro = f.dataset.f; pintarFiltros(); pintarLista(); return; }
    const c = e.target.closest(".copiar");
    if (c) copiar(c.dataset.codigo, c);
  });
  $("recargar").addEventListener("click", cargar);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) cargar(); });
  setInterval(cargar, RECARGA_MS);
  setInterval(pintar, 60 * 1000);
  cargar();

  // ---------------------------------------------------------- notificaciones
  const CLAVE_LOCAL = "cazacupones_push";
  const esIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const instalada = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  const soportaPush = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;

  function leerLocal() { try { return JSON.parse(localStorage.getItem(CLAVE_LOCAL)); } catch { return null; } }
  function guardarLocal(v) { try { localStorage.setItem(CLAVE_LOCAL, JSON.stringify(v)); } catch {} }

  function b64url(bytes) {
    let s = ""; for (const b of bytes) s += String.fromCharCode(b);
    return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }

  function panelAvisos(html) { const el = $("avisos"); el.innerHTML = html; el.hidden = false; }

  function mostrarSecreto(datos, recien) {
    panelAvisos(`
      <h2>${recien ? "¡Listo! Falta un paso" : '<span class="ok-texto">Notificaciones activadas</span> en este celular'}</h2>
      <p>${recien ? "Copiá este texto y guardalo en GitHub para que los avisos lleguen a este celular:" : "Si todavía no lo hiciste, guardá este texto en GitHub:"}</p>
      <textarea id="secreto" readonly>${escapar(JSON.stringify(datos))}</textarea>
      <ol>
        <li>En tu repo: <b>Settings → Secrets and variables → Actions</b>.</li>
        <li>Creá (o editá) el secreto <b>WEBPUSH</b> y pegá el texto.</li>
        <li>Probalo en <b>Actions → Buscar cupones → Run workflow</b> marcando la prueba.</li>
      </ol>
      <div class="fila">
        <button class="boton copiar" type="button" id="copiarSecreto" style="margin-left:0">Copiar texto</button>
        <button class="boton secundario" type="button" id="regenerar">Volver a activar</button>
      </div>`);
    $("copiarSecreto").onclick = (e) => copiar($("secreto").value, e.currentTarget, "Copiar texto");
    $("regenerar").onclick = activarAvisos;
  }

  async function activarAvisos() {
    const permiso = await Notification.requestPermission(); // tiene que ser lo primero tras el toque
    if (permiso !== "granted") {
      panelAvisos(`<h2>Notificaciones bloqueadas</h2><p>Habilitalas en <b>Ajustes → Notificaciones → Cupones</b> y volvé a intentar.</p>`);
      return;
    }
    try {
      const reg = await navigator.serviceWorker.register("sw.js");
      await navigator.serviceWorker.ready;
      const vieja = await reg.pushManager.getSubscription();
      if (vieja) await vieja.unsubscribe();
      // Par de claves propio de este celular: la privada solo queda en tu secreto de GitHub.
      const par = await crypto.subtle.generateKey({ name: "ECDSA", namedCurve: "P-256" }, true, ["sign", "verify"]);
      const publica = new Uint8Array(await crypto.subtle.exportKey("raw", par.publicKey));
      const privada = await crypto.subtle.exportKey("jwk", par.privateKey);
      const sus = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: publica });
      const datos = {
        dispositivo: esIOS ? "iPhone" : (/Android/.test(navigator.userAgent) ? "Android" : "Navegador"),
        clave: privada.d,
        suscripcion: sus.toJSON(),
      };
      guardarLocal(datos);
      mostrarSecreto(datos, true);
    } catch (e) {
      panelAvisos(`<h2>No se pudo activar</h2><p>${escapar(e.message || e)}</p>
        <div class="fila"><button class="boton copiar" type="button" id="activar" style="margin-left:0">Reintentar</button></div>`);
      $("activar").onclick = activarAvisos;
    }
  }

  async function iniciarAvisos() {
    if (!soportaPush) {
      if (esIOS && !instalada) {
        panelAvisos(`<h2>Recibí los avisos en el iPhone</h2><ol>
          <li>Tocá <b>Compartir</b> (el cuadrado con la flecha) en Safari.</li>
          <li>Elegí <b>Agregar a inicio</b>.</li>
          <li>Abrí <b>Cupones</b> desde ese ícono y activá las notificaciones ahí.</li></ol>`);
      }
      return; // en otros navegadores sin soporte, no mostramos nada
    }
    const reg = await navigator.serviceWorker.register("sw.js").catch(() => null);
    const sus = reg && await reg.pushManager.getSubscription();
    const guardado = leerLocal();
    if (sus && guardado && Notification.permission === "granted") {
      mostrarSecreto(guardado, false);
      // ya está todo: lo dejamos plegado para no ocupar lugar
      $("avisos").innerHTML = `<div class="fila" style="margin:0;align-items:center;justify-content:space-between">
        <span><span class="ok-texto">●</span> Notificaciones activadas</span>
        <button class="boton secundario" type="button" id="verSecreto">Ver texto para GitHub</button></div>`;
      $("verSecreto").onclick = () => mostrarSecreto(guardado, false);
      return;
    }
    panelAvisos(`<h2>Avisos en este celular</h2>
      <p>Te llega una notificación cada vez que aparece un cupón nuevo.</p>
      <div class="fila"><button class="boton copiar" type="button" id="activar" style="margin-left:0">Activar notificaciones</button></div>`);
    $("activar").onclick = activarAvisos;
  }
  iniciarAvisos();

  // ------------------------------------------------- última revisión (GitHub)
  const repo = (() => {
    const m = location.hostname.match(/^([^.]+)\.github\.io$/);
    const nombre = location.pathname.split("/").filter(Boolean)[0];
    return m && nombre ? `${m[1]}/${nombre}` : null;
  })();
  let descanso = null;

  function enDescanso(d) {
    if (!d || !d.desde || !d.hasta) return false;
    const partes = new Intl.DateTimeFormat("es-AR", { timeZone: "America/Argentina/Buenos_Aires", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(new Date());
    const ahora = (+partes.find((x) => x.type === "hour").value) * 60 + (+partes.find((x) => x.type === "minute").value);
    const aMin = (t) => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
    const desde = aMin(d.desde), hasta = aMin(d.hasta);
    return desde <= hasta ? ahora >= desde && ahora < hasta : ahora >= desde || ahora < hasta;
  }

  async function cargarRevision() {
    if (!repo) return;
    try {
      if (descanso === null) {
        const c = await fetch(`https://raw.githubusercontent.com/${repo}/main/config.json?t=${Date.now()}`).then((r) => r.json()).catch(() => ({}));
        descanso = c.horario_descanso || {};
      }
      const r = await fetch(`https://api.github.com/repos/${repo}/actions/workflows/buscar.yml/runs?per_page=1&exclude_pull_requests=true`);
      if (!r.ok) return;
      const run = (await r.json()).workflow_runs?.[0];
      const el = $("revision");
      if (!run) { el.textContent = "Todavía no corrió ninguna búsqueda"; return; }
      const minutos = (Date.now() - new Date(run.run_started_at || run.created_at)) / 60000;
      let texto = `Última revisión ${haceCuanto(run.run_started_at || run.created_at)}`;
      let alerta = false;
      if (run.status !== "completed") texto += " · buscando ahora";
      else if (run.conclusion === "failure") { texto += " · falló (mirá Actions)"; alerta = true; }
      if (enDescanso(descanso)) texto += ` · en descanso hasta las ${descanso.hasta}`;
      else if (minutos > 30) { texto += " · está demorada"; alerta = true; }
      el.textContent = texto;
      el.className = "estado" + (alerta ? " alerta" : "");
    } catch {}
  }
  cargarRevision();
  setInterval(cargarRevision, RECARGA_MS);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) cargarRevision(); });
</script>
</body>
</html>
