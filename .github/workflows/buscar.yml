name: Buscar cupones

on:
  schedule:
    # Cada 10 minutos (GitHub puede demorar algunas ejecuciones unos minutos).
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      prueba:
        description: "Solo mandar una notificación de prueba"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: buscar-cupones
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Buscar en X y notificar
        env:
          TWS_TELEMETRY: "0"
          X_COOKIES: ${{ secrets.X_COOKIES }}
          X_USUARIO: ${{ secrets.X_USUARIO }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          WEBPUSH: ${{ secrets.WEBPUSH }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ inputs.prueba }}" = "true" ]; then
            python buscar.py --prueba
          else
            python buscar.py
          fi

      - name: Guardar hallazgos
        if: ${{ inputs.prueba != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/estado.json docs/resultados.json
          if git diff --cached --quiet; then
            echo "Sin novedades."
            exit 0
          fi
          git commit -m "Nuevos hallazgos"
          for intento in 1 2 3; do
            git pull --rebase --quiet && git push --quiet && exit 0
            sleep 5
          done
          exit 1
